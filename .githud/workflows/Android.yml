

name: Build K-Talk Korean APK

on:

  workflow_dispatch:

  push:

    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source

        uses: actions/checkout@v4

      - name: Set up JDK

        uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: '17'

      - name: Set up Gradle

        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK

        run: gradle --version && chmod +x gradlew 2>/dev/null || true
